<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#202024">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cat Gunner">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" href="icon-192.png">
    <title>Idle Cat Gunner · 手机版</title>
    <style>
      html, body {
        margin: 0; width: 100%; height: 100%;
        overscroll-behavior: none; touch-action: manipulation;
        -webkit-user-select: none; user-select: none;
      }
      body { background: #202024; color: #f6f5f8; font: 15px system-ui, sans-serif; }
      #unity-canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
      #loading {
        position: absolute; inset: 0; display: grid; place-content: center; gap: 12px;
        background: #202024; text-align: center; z-index: 5; padding: 0 24px; box-sizing: border-box;
      }
      #loading[hidden] { display: none; }
      progress { accent-color: #f3a3cf; width: min(70vw, 320px); }
      #status { font-size: 15px; line-height: 1.6; max-width: 80vw; }

      /* ---------- 横屏提示 ---------- */
      #rotate-hint {
        position: fixed; inset: 0; z-index: 900; display: none;
        background: rgba(20,20,24,.92); place-content: center; text-align: center; gap: 14px;
      }
      #rotate-hint .icon { font-size: 46px; animation: rot 2.2s ease-in-out infinite; }
      @keyframes rot { 0%,40% { transform: rotate(0); } 60%,100% { transform: rotate(90deg); } }
      #rotate-hint .go { padding: 10px 26px; border: none; border-radius: 12px; background: #f3a3cf; color: #202024; font-weight: 700; font-size: 15px; }

      /* ---------- 修改器（底部抽屉式，适配触屏） ---------- */
      #cheat-btn {
        position: fixed; left: 50%; top: calc(8px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 1000;
        padding: 9px 14px; border: none; border-radius: 22px;
        background: #f3a3cf; color: #202024; font-weight: 700; font-size: 14px;
        cursor: pointer; opacity: .88; touch-action: manipulation; white-space: nowrap;
      }
      #load-retry {
        margin: 4px auto 0; display: none; padding: 10px 22px; border: none; border-radius: 12px;
        background: #f3a3cf; color: #202024; font-weight: 700; font-size: 15px; touch-action: manipulation;
      }
      #cheat-panel {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000;
        max-height: 72vh; overflow: auto; display: none;
        background: #2a2a30; color: #f6f5f8; border-radius: 18px 18px 0 0;
        padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
        box-shadow: 0 -8px 40px rgba(0,0,0,.55); font-size: 14px;
        -webkit-user-select: auto; user-select: auto;
      }
      #cheat-panel h3 { margin: 0 0 8px; font-size: 16px; }
      #cheat-panel label { display: block; margin: 12px 0 6px; color: #c9c9d1; font-size: 13px; }
      #cheat-panel input[type=number], #cheat-panel input[type=text] {
        width: 100%; box-sizing: border-box; padding: 12px; border-radius: 10px;
        border: 1px solid #55555e; background: #1c1c20; color: #f6f5f8; font-size: 16px;
      }
      #cheat-panel .row { display: flex; gap: 10px; margin-top: 14px; }
      #cheat-panel button {
        flex: 1; padding: 13px; border: none; border-radius: 12px; cursor: pointer;
        background: #f3a3cf; color: #202024; font-weight: 700; font-size: 15px; touch-action: manipulation;
      }
      #cheat-panel button.secondary { background: #45454d; color: #f6f5f8; font-weight: 400; }
      #cheat-panel .hint { color: #9a9aa3; font-size: 12px; line-height: 1.6; margin: 8px 0 0; }
      #cheat-fields { font-size: 13px; color: #c9c9d1; }
      #cheat-fields table { width: 100%; border-collapse: collapse; margin-top: 6px; }
      #cheat-fields td { padding: 8px 4px; border-bottom: 1px solid #3a3a41; }
      #cheat-fields input {
        width: 130px; padding: 9px; border-radius: 8px; font-size: 16px;
        border: 1px solid #55555e; background: #1c1c20; color: #f6f5f8;
      }
      #cheat-msg { margin-top: 10px; font-size: 13px; min-height: 18px; color: #9be29b; white-space: pre-wrap; }
      #cheat-msg.err { color: #ff9b9b; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="0" aria-label="Idle Cat Gunner"></canvas>
    <div id="loading" role="status">
      <strong id="status">正在加载 Idle Cat Gunner…<br>首次加载约 57MB，请在 Wi-Fi 下进行</strong>
      <progress id="progress" max="1" value="0"></progress>
      <button id="load-retry">清理缓存并重试</button>
    </div>

    <div id="rotate-hint">
      <div class="icon">📱</div>
      <div>建议横屏游玩<br><small style="color:#9a9aa3">（竖屏也可以玩，仅提示一次）</small></div>
      <button class="go" id="rotate-ok">知道了</button>
    </div>

    <button id="cheat-btn">💎 修改器</button>
    <div id="cheat-panel">
      <h3>💎 数值修改器</h3>
      <div id="cheat-main-ui">
        <label>钻石数量</label>
        <input type="number" id="cheat-diamond" inputmode="numeric" min="0" step="1" placeholder="输入想要的钻石数量">
        <div class="row">
          <button id="cheat-apply">修改并重载</button>
          <button id="cheat-adv" class="secondary">高级模式</button>
        </div>
        <div class="row">
          <button id="cheat-auto">▶️ 自动升级 +10分钟</button>
          <button id="cheat-noad" class="secondary">🚫 去广告</button>
        </div>
        <p class="hint">修改会写入本机存档并自动重载游戏。请先进入游戏一次（产生存档）后再修改。数值不要超过 999 万亿，否则游戏可能崩溃。</p>
      </div>
      <div id="cheat-adv-ui" style="display:none">
        <label>存档中的数值字段（可自由编辑，整格删掉重输）</label>
        <div id="cheat-fields"></div>
        <div class="row">
          <button id="cheat-apply-adv">保存全部并重载</button>
          <button id="cheat-back" class="secondary">返回</button>
        </div>
        <p class="hint">Dia=钻石 Ruby=红宝石 Money=金币 PetCoin=宠物币 StarGem=星星宝石 Pig_Gem=存钱罐</p>
      </div>
      <div class="row" style="margin-top:18px">
        <button id="cheat-clear" class="secondary" style="font-size:13px;padding:10px">🧹 清理缓存并重载（游戏加载报错时使用）</button>
      </div>
      <div id="cheat-msg"></div>
    </div>

    <script>
      /* ==================== PWA / 移动端适配 ==================== */
      // data.gz 的二进制内容会被 CDN WAF 拦截，改为 base64 分块 + 浏览器端解码还原
      (function patchFetchForData() {
        const origFetch = window.fetch.bind(window);
        const N = 6; // 分块数，与 game/Build/web-build.data.b64.N 一致
        window.fetch = function (input, init) {
          const url = typeof input === 'string' ? input : (input && input.url) || '';
          if (/web-build\.data\.gz(\?|$)/.test(url)) {
            const base = url.replace(/web-build\.data\.gz.*$/, 'web-build.data.b64.');
            return (async () => {
              const texts = await Promise.all(
                Array.from({ length: N }, (_, i) => origFetch(base + i).then((r) => r.text()))
              );
              const chunks = [];
              let total = 0;
              for (const t of texts) {
                const bin = atob(t);
                const u8 = new Uint8Array(bin.length);
                for (let j = 0; j < bin.length; j++) u8[j] = bin.charCodeAt(j);
                chunks.push(u8);
                total += u8.length;
              }
              const out = new Uint8Array(total);
              let off = 0;
              for (const c of chunks) { out.set(c, off); off += c.length; }
              return new Response(out, { status: 200, headers: { 'Content-Type': 'application/octet-stream' } });
            })();
          }
          return origFetch(input, init);
        };
      })();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      }

      // 修复历史版本写入的字符串 timestamp（游戏 IDBFS 同步要求 Date 对象，否则 getTime 崩溃）
      (function repairIdbfsTimestamps() {
        try {
          const open = indexedDB.open('/idbfs');
          open.onsuccess = () => {
            try {
              const store = open.result.transaction('FILE_DATA', 'readwrite').objectStore('FILE_DATA');
              const keysReq = store.getAllKeys();
              const valsReq = store.getAll();
              let keys = null, vals = null;
              const tryFix = () => {
                if (!keys || !vals) return;
                let fixed = 0;
                for (let i = 0; i < keys.length; i++) {
                  const rec = vals[i];
                  if (rec && typeof rec.timestamp === 'string') {
                    rec.timestamp = new Date(rec.timestamp);
                    store.put(rec, keys[i]); // FILE_DATA 无 keyPath，必须显式指定 key
                    fixed++;
                  }
                }
                if (fixed) console.log('[cheat] 已修复 ' + fixed + ' 条存档时间戳');
              };
              keysReq.onsuccess = () => { keys = keysReq.result; tryFix(); };
              valsReq.onsuccess = () => { vals = valsReq.result; tryFix(); };
            } catch (e) {}
          };
        } catch (e) {}
      })();

      // 竖屏时提示横屏（仅一次）
      const rotateHint = document.querySelector('#rotate-hint');
      function checkOrientation() {
        const portrait = window.innerHeight > window.innerWidth * 1.05;
        const dismissed = sessionStorage.getItem('rotateDismissed') === '1';
        rotateHint.style.display = portrait && !dismissed ? 'grid' : 'none';
      }
      document.querySelector('#rotate-ok').addEventListener('click', () => {
        sessionStorage.setItem('rotateDismissed', '1');
        rotateHint.style.display = 'none';
        const el = document.documentElement;
        const fs = el.requestFullscreen || el.webkitRequestFullscreen;
        if (fs && !document.fullscreenElement) { try { fs.call(el).catch(() => {}); } catch (e) {} }
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }
      });
      window.addEventListener('resize', checkOrientation);
      checkOrientation();

      const canvas = document.querySelector('#unity-canvas');
      const loading = document.querySelector('#loading');
      const progressBar = document.querySelector('#progress');

      // ==== 音频桥（保留原站逻辑） ====
      const portalAudio = (function installGameAudioBridge(report, storageKey) {
        var muted = false;
        try { muted = window.localStorage.getItem(storageKey) === 'true'; } catch (e) {}
        var contexts = new Map();
        var nodePrototype = window.AudioNode && window.AudioNode.prototype;
        var supported = !!(nodePrototype && nodePrototype.connect);
        function reportState() {
          document.documentElement.dataset.portalAudioMuted = String(muted);
        }
        if (supported) {
          var connect = nodePrototype.connect;
          var disconnect = nodePrototype.disconnect;
          function outputFor(context) {
            if (!contexts.has(context)) {
              var gain = context.createGain();
              gain.gain.value = muted ? 0 : 1;
              connect.call(gain, context.destination);
              contexts.set(context, gain);
            }
            return contexts.get(context);
          }
          nodePrototype.connect = function (destination) {
            var args = Array.prototype.slice.call(arguments);
            if (destination === this.context.destination) args[0] = outputFor(this.context);
            var result = connect.apply(this, args);
            return result === args[0] ? destination : result;
          };
          nodePrototype.disconnect = function (destination) {
            if (destination === this.context.destination && contexts.has(this.context))
              return disconnect.apply(this, arguments);
            return disconnect.apply(this, arguments);
          };
        }
        reportState();
        return { reportState: reportState };
      })(function () {}, 'catgunner:muted:idlecatgunner');

      let instance;
      let rendered = false;

      function finishLoading() {
        if (!instance || !rendered) return;
        document.body.dataset.gameState = 'ready';
        portalAudio.reportState();
        loading.hidden = true;
        checkOrientation();
      }

      window.desktopPortal = { rendered() { rendered = true; finishLoading(); } };

      const config = {
        dataUrl: 'game/Build/web-build.data.gz',        // gzip 包，loader 内置解压
        frameworkUrl: 'game/Build/web-build.framework.js',
        codeUrl: 'game/Build/web-build.wasm.gz',        // gzip 包，loader 内置解压
        streamingAssetsUrl: 'StreamingAssets',
        companyName: 'Ravanla',
        productName: 'Idle Cat Gunner',
        productVersion: '0.77.0',
        matchWebGLToCanvasSize: true,
        autoSyncPersistentDataPath: true,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2), // 限制内存占用
        showBanner: (message, type) => {
          if (type === 'error') {
            document.querySelector('#status').textContent = '游戏加载失败：' + message;
            document.querySelector('#load-retry').style.display = 'block';
          }
        },
      };

      // 清理 PWA 缓存并刷新（用于缓存被污染后的修复）
      async function clearCacheAndReload() {
        try {
          if (window.caches && caches.keys) {
            const ks = await caches.keys();
            await Promise.all(ks.map((k) => caches.delete(k)));
          }
          if (navigator.serviceWorker) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((r) => r.unregister()));
          }
        } catch (e) {}
        location.reload();
      }
      document.querySelector('#load-retry').addEventListener('click', clearCacheAndReload);

      const loader = document.createElement('script');
      loader.src = 'game/Build/web-build.loader.js';
      loader.onerror = () => {
        document.querySelector('#status').textContent = '无法加载游戏引擎，请检查网络后刷新。';
      };
      loader.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBar.value = progress;
        }).then((game) => {
          instance = game;
          window.__gameInstance = game;
          finishLoading();
        }).catch((error) => {
          document.querySelector('#status').textContent = '游戏加载失败：' + error;
        });
      };
      document.body.append(loader);
    </script>

    <script>
      /* ==================== 修改器逻辑（NoSaveFile.json / base64(JSON) 存档） ==================== */
      function msg(text, isErr) {
        const el = document.querySelector('#cheat-msg');
        el.textContent = text;
        el.className = isErr ? 'err' : '';
      }

      const SAVE_SUFFIX = 'NoSaveFile.json';

      function openSaveDB() {
        return new Promise((res, rej) => {
          const req = indexedDB.open('/idbfs');
          req.onsuccess = () => res(req.result);
          req.onerror = () => rej(req.error);
        });
      }

      function idbDone(req) {
        return new Promise((res, rej) => {
          req.onsuccess = () => res(req.result);
          req.onerror = () => rej(req.error);
        });
      }

      async function readSave() {
        const db = await openSaveDB();
        const keys = await idbDone(db.transaction('FILE_DATA', 'readonly').objectStore('FILE_DATA').getAllKeys());
        const saveKeys = keys.filter((k) => typeof k === 'string' && k.endsWith(SAVE_SUFFIX));
        if (!saveKeys.length) throw new Error('未找到存档，请先进入游戏一次');
        const store = db.transaction('FILE_DATA', 'readonly').objectStore('FILE_DATA');
        const out = {};
        for (const k of saveKeys) {
          const rec = await idbDone(store.get(k));
          let text;
          if (rec.contents instanceof Uint8Array) text = new TextDecoder().decode(rec.contents);
          else if (rec.contents instanceof ArrayBuffer) text = new TextDecoder().decode(new Uint8Array(rec.contents));
          else text = String(rec.contents);
          out[k] = { rec, json: JSON.parse(atob(text.trim())) };
        }
        db.close();
        return out;
      }

      async function writeSave(saves) {
        const db = await openSaveDB();
        const tx = db.transaction('FILE_DATA', 'readwrite');
        const store = tx.objectStore('FILE_DATA');
        for (const [k, s] of Object.entries(saves)) {
          const text = btoa(JSON.stringify(s.json));
          s.rec.contents = new TextEncoder().encode(text);
          s.rec.timestamp = new Date(); // 必须是 Date 对象，IDBFS 同步时会调用 getTime()
          store.put(s.rec, k);
        }
        await new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
        db.close();
      }

      function readBig(v) {
        if (v == null) return 0;
        if (typeof v === 'number') return v;
        const d = String(v.s_digits || '0');
        const e = v.s_exponent || 0;
        return Number(d) * Math.pow(10, e);
      }
      // 大数转普通字符串（避免 iOS number 输入框显示科学计数法/无法编辑）
      function bigToPlainString(v) {
        if (v == null) return '0';
        if (typeof v === 'number') return String(v);
        const raw = String(v.s_digits == null || v.s_digits === '' ? '0' : v.s_digits);
        const e = v.s_exponent || 0;
        const neg = raw.startsWith('-');
        const digits = (neg ? raw.slice(1) : raw) || '0';
        try {
          if (e >= 0) return (neg ? '-' : '') + (BigInt(digits) * 10n ** BigInt(e)).toString();
          const s = BigInt(digits).toString().padStart(-e + 1, '0');
          const cut = s.length + e;
          return (neg ? '-' : '') + s.slice(0, cut) + '.' + s.slice(cut);
        } catch (err) {
          return String(readBig(v));
        }
      }
      function makeBig(value, like) {
        if (like && typeof like === 'object') {
          const e = like.s_exponent || 0;
          const digits = Math.round(value * Math.pow(10, -e));
          return { s_digits: String(digits), s_exponent: e };
        }
        return value;
      }

      const FIELDS = [
        { key: 'Dia',     name: '钻石 (Dia)' },
        { key: 'Ruby',    name: '红宝石 (Ruby)',    kind: 'big' },
        { key: 'Money',   name: '金币 (Money)',     kind: 'big' },
        { key: 'PetCoin', name: '宠物币 (PetCoin)' },
        { key: 'StarGem', name: '星星宝石 (StarGem)' },
        { key: 'Pig_Gem', name: '存钱罐宝石 (Pig_Gem)' },
      ];

      async function loadCheatData() {
        const saves = await readSave();
        const main = Object.values(saves)[0];
        return { saves, main: main.json };
      }

      async function applyDiamond() {
        try {
          let val = parseInt(document.querySelector('#cheat-diamond').value, 10);
          if (!Number.isFinite(val) || val < 0) return msg('请输入有效的钻石数量', true);
          if (val > 999999999999999) { val = 999999999999999; msg('数值过大已限制为 999 万亿'); }
          msg('正在读取存档…');
          const { saves, main } = await loadCheatData();
          const old = main.Dia || 0;
          main.Dia = val;
          if (typeof main._getDia === 'number') main._getDia = (main._getDia || 0) + Math.max(0, val - old);
          await writeSave(saves);
          msg('修改成功：钻石 ' + old + ' → ' + val + '，正在重载游戏…');
          setTimeout(() => location.reload(), 600);
        } catch (e) {
          msg('修改失败：' + e.message, true);
        }
      }

      async function openAdvanced() {
        try {
          msg('正在读取存档…');
          const { main } = await loadCheatData();
          const container = document.querySelector('#cheat-fields');
          container.innerHTML = '';
          let shown = 0;
          for (const f of FIELDS) {
            const v = main[f.key];
            const cur = f.kind === 'big' ? bigToPlainString(v) : String(v || 0);
            const row = document.createElement('table');
            row.innerHTML = '<tr><td>' + f.name + '</td><td style="text-align:right"><input type="text" inputmode="numeric" pattern="[0-9]*" value="' + cur +
              '" data-key="' + f.key + '" data-kind="' + (f.kind || 'int') + '"></td></tr>';
            container.appendChild(row);
            shown++;
          }
          if (!shown) return msg('存档字段为空', true);
          document.querySelector('#cheat-main-ui').style.display = 'none';
          document.querySelector('#cheat-adv-ui').style.display = '';
          msg('当前存档数值如下，可自由修改');
        } catch (e) {
          msg('读取失败：' + e.message, true);
        }
      }

      const VALUE_CAP = 999999999999999; // 999 万亿，超出可能导致游戏崩溃

      async function applyAdvanced() {
        try {
          msg('正在保存…');
          const { saves, main } = await loadCheatData();
          const inputs = document.querySelectorAll('#cheat-fields input[data-key]');
          let changed = 0, skipped = 0;
          for (const inp of inputs) {
            const key = inp.dataset.key;
            const kind = inp.dataset.kind;
            const text = String(inp.value || '').trim().replace(/[, _]/g, '');
            if (!/^\d+(\.\d+)?$/.test(text)) { if (text) skipped++; continue; } // 空或非法则跳过
            let nv = parseFloat(text);
            if (!Number.isFinite(nv) || nv < 0) { skipped++; continue; }
            if (nv > VALUE_CAP) nv = VALUE_CAP;
            const oldVal = kind === 'big' ? readBig(main[key]) : (main[key] || 0);
            if (nv !== oldVal) {
              main[key] = makeBig(Math.round(nv), kind === 'big' ? main[key] : null);
              changed++;
            }
          }
          if (!changed) return msg(skipped ? ('没有保存：' + skipped + ' 个输入框内容无效') : '没有改动', true);
          await writeSave(saves);
          msg('已保存 ' + changed + ' 处修改' + (skipped ? ('，' + skipped + ' 处无效被跳过') : '') + '，正在重载游戏…');
          setTimeout(() => location.reload(), 600);
        } catch (e) {
          msg('保存失败：' + e.message, true);
        }
      }

      // 自动升级续时：实测游戏运行时会把剩余秒数钳制在 600 以内（内部硬限制，存档无法突破），
      // 但每次点击写入 600 秒并重载即可重新激活，可无限次续
      // 实测倒计时仅以约 0.33 秒/秒 消耗，600 秒实际可玩约 30 分钟
      async function applyAutoUnlock() {
        try {
          msg('正在读取存档…');
          const { saves, main } = await loadCheatData();
          const now = new Date();
          const ymd = now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0');
          main.Is_AutoUpgrade_Pack = true;
          main.AD_AutoUpgrade_RemainSec = 600;
          main.AD_AutoUpgrade_LastDate = ymd;
          await writeSave(saves);
          msg('自动升级已续 10 分钟（实测约 30 分钟），正在重载游戏…');
          setTimeout(() => location.reload(), 600);
        } catch (e) {
          msg('操作失败：' + e.message, true);
        }
      }

      // 去广告
      async function applyNoAds() {
        try {
          msg('正在读取存档…');
          const { saves, main } = await loadCheatData();
          main.Is_Remove_AD_All = true;
          main.Is_Remove_AD_forced = true;
          await writeSave(saves);
          msg('已去除广告，正在重载游戏…');
          setTimeout(() => location.reload(), 600);
        } catch (e) {
          msg('操作失败：' + e.message, true);
        }
      }

      /* ---- UI 事件 ---- */
      document.querySelector('#cheat-btn').addEventListener('click', () => {
        const p = document.querySelector('#cheat-panel');
        p.style.display = p.style.display === 'block' ? 'none' : 'block';
        msg('');
        document.querySelector('#cheat-main-ui').style.display = '';
        document.querySelector('#cheat-adv-ui').style.display = 'none';
      });
      document.querySelector('#cheat-apply').addEventListener('click', applyDiamond);
      document.querySelector('#cheat-adv').addEventListener('click', openAdvanced);
      document.querySelector('#cheat-apply-adv').addEventListener('click', applyAdvanced);
      document.querySelector('#cheat-auto').addEventListener('click', applyAutoUnlock);
      document.querySelector('#cheat-noad').addEventListener('click', applyNoAds);
      document.querySelector('#cheat-clear').addEventListener('click', clearCacheAndReload);
      document.querySelector('#cheat-back').addEventListener('click', () => {
        document.querySelector('#cheat-main-ui').style.display = '';
        document.querySelector('#cheat-adv-ui').style.display = 'none';
      });
    </script>
  </body>
</html>
